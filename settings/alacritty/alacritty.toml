[general]
import = [
  "~/.config/alacritty/current-theme.toml",
  "~/AppData/Roaming/alacritty/current-theme.toml",
  # macOS-only font size. setup_alacritty() symlinks font-mac.toml here only on
  # macOS. on Linux/Windows this path is absent and the import is skipped.
  "~/.config/alacritty/font-mac.toml",
]

[selection]
save_to_clipboard = true

[mouse]
bindings = [
  { mouse = "Right", action = "Paste" },
]

[window.dimensions]
columns = 120
lines = 40

[window]
padding.x = 0
padding.y = 0
# macOS: treat Option as Alt instead of typing accented characters.
# "Both" = both Option keys; use "OnlyLeft"/"OnlyRight" to keep one for accents.
option_as_alt = "Both"

[keyboard]
bindings = [
  { key = "C", mods = "Control|Shift", action = "Copy" },
  { key = "V", mods = "Control|Shift", action = "Paste" },

  # Disable F1–F12 keys
  { key = "F1",  action = "None" },
  { key = "F2",  action = "None" },
  { key = "F3",  action = "None" },
  { key = "F4",  action = "None" },
  { key = "F5",  action = "None" },
  { key = "F6",  action = "None" },
  { key = "F7",  action = "None" },
  { key = "F8",  action = "None" },
  { key = "F9",  action = "None" },
  { key = "F10", action = "None" },
  { key = "F11", action = "None" },
  { key = "F12", action = "None" },
]
