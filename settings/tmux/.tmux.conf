# Drop ANDROID_SERIAL inherited at server start. Otherwise it overrides the device picked in android_devices.py.
set-environment -gu ANDROID_SERIAL

# Enable focus events to allow applications inside tmux to receive focus signals
set -g focus-events on

# Useful when using shared sessions with different screen sizes
set -g aggressive-resize on

# Fix Colors
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"

# Allow applications inside tmux panes to set the external clipboard via OSC 52.
set -s set-clipboard on

# Set the prefix key to Ctrl+A
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Map Ctrl+b to send Ctrl+a to the application
bind-key -n C-b send-keys C-a

# Script bindings are registered at runtime from each script's tmuxHotkey config.

# Switch to the myscripts manager window, or recreate it if it has been closed.
bind-key 0 run-shell 'tmux select-window -t "=myscriptsmgr" 2>/dev/null || tmux new-window -n myscriptsmgr myscripts'

bind-key Tab last-window

# Enter copy mode and scroll with prefix + Up/Down.
bind-key Up copy-mode \; send-keys -X cursor-up
bind-key Down copy-mode \; send-keys -X cursor-down

# Kill pane without confirmation
bind-key x kill-pane

bind-key r source-file ~/myscripts/settings/tmux/.tmux.conf \; display-message "tmux config reloaded"

# Capture pane content and send to the default agent
bind-key i run-shell 'start_script r/ai/agent.py --context "$(~/myscripts/settings/tmux/agent_context.sh)"'

# Start window and pane numbering at 1 instead of 0
set-option -g base-index 1
set-option -g pane-base-index 1

# Automatically renumber windows when one is closed
set-option -g renumber-windows on

# Allow programs to set the terminal title via escape sequences
set -g set-titles on
set -g set-titles-string "#W"

# Status bar configuration
set -g status-left ""
set -g status-right-length 40
set -g status-right '#(tmux list-windows -a -F "##{window_name}" | awk '\''/⧗|⠂|⠐|⠋|⠙|⠹|⠸|⠼|⠴|⠦|⠧|⠇|⠏/ { running++; next } /✓|✳/ { done++ } END { if (done) text = "#[fg=green]DONE:" done; if (running) text = text (text ? " " : "") "#[fg=yellow]WIP:" running; if (text) print " " text "#[default]" }'\'')'
# Highlight the status bar yellow when the prefix key is pressed
set -g status-style "bg=#{?client_prefix,yellow,black},fg=white"
set-window-option -g window-status-current-format '#I:#W'
set-window-option -g window-status-format ''
set -g window-status-separator ''

# Use Vi keys in copy mode
setw -g mode-keys vi

# Go to the top of the history with Home
bind-key -T copy-mode Home send-keys -X history-top
bind-key -T copy-mode-vi Home send-keys -X history-top

# Go to the bottom of the history with End
bind-key -T copy-mode End send-keys -X history-bottom
bind-key -T copy-mode-vi End send-keys -X history-bottom
