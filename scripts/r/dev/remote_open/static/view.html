<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loading...</title>
<link rel="icon" href="/favicon.svg">
<style>
:root {
    --bg: #1e1e1e;
    --fg: #e0e0e0;
    --muted: #888;
    --border: #333;
}
* { box-sizing: border-box; }
html, body {
    margin: 0;
    height: 100%;
}
body {
    background: var(--bg);
    color: var(--fg);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
}
#path {
    flex: 0 0 auto;
    padding: 8px 220px 8px 12px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 12px;
    color: var(--muted);
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
    overflow-x: auto;
}
#toolbar {
    position: fixed;
    top: 5px;
    right: 12px;
    z-index: 10;
    display: flex;
    gap: 6px;
    align-items: center;
}
.tbtn {
    padding: 5px 8px;
    color: var(--muted);
    background: #2a2a2a;
    border: 1px solid var(--border);
    border-radius: 4px;
    cursor: pointer;
    font-size: 12px;
}
.tbtn:hover { background: #383838; color: var(--fg); }
.tbtn .key { opacity: .6; margin-left: 4px; }
#copybtn { display: none; }
#viewer {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 12px;
    overflow: auto;
}
#viewer img,
#viewer video {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
}
#viewer iframe {
    width: 100%;
    height: 100%;
    border: none;
}
#viewer pre {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: auto;
    padding: 12px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 13px;
    white-space: pre-wrap;
    word-break: break-word;
}
</style>
</head>
<body>
<div id="toolbar"><button id="copypathbtn" class="tbtn"></button><button id="copybtn" class="tbtn"></button></div>
<div id="path"></div>
<div id="viewer"></div>
<script src="/annotate.js"></script>
<script>
var IMG = ["png","jpg","jpeg","gif","webp","svg","bmp","ico","tiff"];
var VID = ["mp4","webm","mov","avi","mkv"];
var AUD = ["mp3","wav","ogg","flac","aac"];
var MD = ["md","markdown","mdown","mkd"];

function loadScript(url) {
    return new Promise(function (res, rej) {
        var s = document.createElement("script");
        s.src = url;
        s.onload = res;
        s.onerror = rej;
        document.head.appendChild(s);
    });
}

function loadStyle(url) {
    if (document.querySelector('link[href="' + url + '"]')) return;
    var link = document.createElement("link");
    link.rel = "stylesheet";
    link.href = url;
    document.head.appendChild(link);
}

function renderMarkdown(v, text) {
    var CDN = "https://cdn.jsdelivr.net/npm/";
    loadStyle("/markdown.css");
    var markedReady = window.marked
        ? Promise.resolve()
        : loadScript(CDN + "marked/marked.min.js");
    return markedReady
        .then(function () {
            v.classList.add("md");
            v.innerHTML = '<div class="markdown-body"></div>';
            var body = v.querySelector(".markdown-body");
            body.innerHTML = marked.parse(text);
            loadStyle(CDN + "highlight.js/styles/github-dark.min.css");
            return window.hljs
                ? Promise.resolve()
                : loadScript(CDN + "highlight.js/lib/common.min.js").catch(function () {});
        })
        .then(function () {
            if (window.hljs) {
                v.querySelectorAll("pre code").forEach(function (b) { hljs.highlightElement(b); });
            }
        })
        .catch(function () {
            v.innerHTML = "<pre>" + esc(text) + "</pre>";
        });
}

var isMac = /Mac/i.test(navigator.platform || "");
var ALT = isMac ? "⌥" : "Alt+";
var copyBtn = document.getElementById("copybtn");
var copyPathBtn = document.getElementById("copypathbtn");
var COPY_LABEL = 'Copy text<span class="key">' + ALT + 'C</span>';
var PATH_LABEL = 'Copy path<span class="key">' + ALT + 'P</span>';
copyBtn.innerHTML = COPY_LABEL;
copyPathBtn.innerHTML = PATH_LABEL;

function flashBtn(btn, label, ok) {
    btn.textContent = ok ? "Copied" : "Failed";
    setTimeout(function () { btn.innerHTML = label; }, 1200);
}

function copyViaSelection(el) {
    var range = document.createRange();
    range.selectNodeContents(el);
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
    var ok = false;
    try { ok = document.execCommand("copy"); } catch (e) {}
    sel.removeAllRanges();
    flashBtn(copyBtn, COPY_LABEL, ok);
}

function copyRich() {
    var body = document.querySelector(".markdown-body");
    if (!body) return;
    if (navigator.clipboard && window.ClipboardItem) {
        navigator.clipboard
            .write([
                new ClipboardItem({
                    "text/html": new Blob([body.innerHTML], { type: "text/html" }),
                    "text/plain": new Blob([body.innerText], { type: "text/plain" }),
                }),
            ])
            .then(function () { flashBtn(copyBtn, COPY_LABEL, true); })
            .catch(function () { copyViaSelection(body); });
    } else {
        copyViaSelection(body);
    }
}

function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
        return navigator.clipboard.writeText(text);
    }
    return new Promise(function (res, rej) {
        var ta = document.createElement("textarea");
        ta.value = text;
        ta.style.position = "fixed";
        ta.style.opacity = "0";
        document.body.appendChild(ta);
        ta.select();
        var ok = false;
        try { ok = document.execCommand("copy"); } catch (e) {}
        document.body.removeChild(ta);
        ok ? res() : rej();
    });
}

function copyPath() {
    if (!path) return;
    copyText(path)
        .then(function () { flashBtn(copyPathBtn, PATH_LABEL, true); })
        .catch(function () { flashBtn(copyPathBtn, PATH_LABEL, false); });
}

copyBtn.addEventListener("click", copyRich);
copyPathBtn.addEventListener("click", copyPath);
document.addEventListener("keydown", function (e) {
    if (!e.altKey || e.ctrlKey || e.metaKey) return;
    if (e.code === "KeyC") {
        if (copyBtn.style.display !== "none") { e.preventDefault(); copyRich(); }
    } else if (e.code === "KeyP") {
        e.preventDefault();
        copyPath();
    }
});

function ext(name) {
    var parts = name.split(".");
    return parts.length > 1 ? parts.pop().toLowerCase() : "";
}

function esc(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

var path = new URLSearchParams(location.search).get("path");
if (path) {
    var name = path.split("/").pop().split("?")[0];
    document.title = "ropen - " + name;
    document.getElementById("path").textContent = path;

    var v = document.getElementById("viewer");
    var e = ext(name);
    var encPath = path.split("/").map(encodeURIComponent).join("/");
    var fileUrl = "/api/file" + encPath;
    var statUrl = "/api/stat" + encPath;

    function snapshotScroll() {
        var pre = v.querySelector("pre");
        return { v: v.scrollTop, pre: pre ? pre.scrollTop : 0 };
    }

    function restoreScroll(s) {
        if (!s) return;
        var apply = function () {
            v.scrollTop = s.v;
            var pre = v.querySelector("pre");
            if (pre) pre.scrollTop = s.pre;
        };
        apply();
        requestAnimationFrame(function () { apply(); requestAnimationFrame(apply); });
    }

    function render(bust) {
        var src = fileUrl + (bust ? "?t=" + bust : "");
        var scroll = bust ? snapshotScroll() : null;
        if (IMG.indexOf(e) >= 0) {
            v.innerHTML = '<img src="' + src + '">';
            restoreScroll(scroll);
            if (window.Annotator) Annotator.disable();
        } else if (VID.indexOf(e) >= 0) {
            v.innerHTML = '<video controls src="' + src + '"></video>';
            if (window.Annotator) Annotator.disable();
        } else if (AUD.indexOf(e) >= 0) {
            v.innerHTML = '<audio controls src="' + src + '"></audio>';
            if (window.Annotator) Annotator.disable();
        } else if (e === "pdf") {
            v.innerHTML = '<iframe src="' + src + '"></iframe>';
            if (window.Annotator) Annotator.disable();
        } else if (MD.indexOf(e) >= 0) {
            fetch(src)
                .then(function (r) { return r.text(); })
                .then(function (t) { return renderMarkdown(v, t); })
                .then(function () {
                    restoreScroll(scroll);
                    copyBtn.style.display = "inline-block";
                    if (window.Annotator) {
                        Annotator.enable(v.querySelector(".markdown-body"), path);
                    }
                });
        } else {
            fetch(src)
                .then(function (r) { return r.text(); })
                .then(function (t) {
                    v.innerHTML = "<pre>" + esc(t) + "</pre>";
                    restoreScroll(scroll);
                    if (window.Annotator) Annotator.enable(v.querySelector("pre"), path);
                });
        }
    }

    function watch() {
        var last = null;
        setInterval(function () {
            fetch(statUrl)
                .then(function (r) { return r.ok ? r.json() : null; })
                .then(function (s) {
                    if (!s) return;
                    var sig = s.mtime + ":" + s.size;
                    if (last === null) { last = sig; return; }
                    if (sig !== last) {
                        last = sig;
                        render(s.mtime);
                    }
                })
                .catch(function () {});
        }, 1000);
    }

    render();
    watch();
}
</script>
</body>
</html>
