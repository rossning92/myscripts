<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Remote Open</title>
<link rel="icon" href="/favicon.svg">
<style>
:root {
    --bg: #1e1e1e;
    --fg: #e0e0e0;
    --muted: #888;
    --border: #333;
    --link: #4ea1ff;
}
* { box-sizing: border-box; }
body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    max-width: 760px;
    margin: 0 auto;
    padding: 24px 16px;
}
h2 {
    font-size: 18px;
    font-weight: 600;
    margin: 0 0 16px;
}
#status {
    font-size: 13px;
    font-weight: 400;
    color: var(--muted);
}
#empty {
    color: var(--muted);
}
ul {
    list-style: none;
    margin: 0;
    padding: 0;
}
li {
    padding: 8px 10px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: baseline;
    gap: 8px;
}
li a {
    color: var(--link);
    text-decoration: none;
    word-break: break-all;
}
li a:hover {
    text-decoration: underline;
}
li small {
    color: var(--muted);
    margin-left: auto;
    white-space: nowrap;
    font-size: 12px;
}
#popup-warning {
    margin-top: 12px;
    padding: 8px 12px;
    background: #4a1f1f;
    color: #ff9b9b;
    border-radius: 4px;
    font-size: 13px;
}
</style>
</head>
<body>
<h2>Remote Open <span id="status">(connecting...)</span></h2>
<div id="empty">waiting for files ...</div>
<ul id="list"></ul>
<div id="popup-warning" style="display:none">
    Pop-ups blocked - please allow pop-ups for this site
</div>
<script>
const items = [];
const seen = new Set();
let isReplay = true;

function esc(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;")
            .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function itemUrl(it) {
    return it.type === "url" ? it.path : "/view.html?path=" + encodeURIComponent(it.path);
}

function render() {
    document.getElementById("empty").style.display = items.length ? "none" : "block";
    document.getElementById("list").innerHTML = items
        .map(
            (it) =>
                "<li><a href=\"" + esc(itemUrl(it)) + '" target="_blank">' +
                esc(it.name) + "</a> <small>" + it.time + "</small></li>"
        )
        .join("");
}

function addItem(it) {
    if (seen.has(it.id)) return;
    seen.add(it.id);
    items.unshift(it);
    render();

    if (!isReplay) {
        var feat = "popup,left=0,top=0,width=" + screen.availWidth +
                   ",height=" + screen.availHeight;
        var w = window.open(itemUrl(it), "_blank", feat);
        if (!w || w.closed) {
            document.getElementById("popup-warning").style.display = "block";
        }
    }
}

function connect() {
    isReplay = true;
    var es = new EventSource("/api/events");
    var st = document.getElementById("status");
    es.onopen = function () {
        st.textContent = "(connected)";
        setTimeout(function () { isReplay = false; }, 500);
    };
    es.onerror = function () {
        st.textContent = "(disconnected - reconnecting...)";
        es.close();
        setTimeout(function () { location.reload(); }, 2000);
    };
    es.onmessage = function (e) { addItem(JSON.parse(e.data)); };
}
connect();
</script>
</body>
</html>
