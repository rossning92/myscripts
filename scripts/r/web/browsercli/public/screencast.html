<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content"
    />
    <title>Screencast</title>
    <link rel="stylesheet" href="/static/virtual-keys.css" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      :root {
        color-scheme: dark;
        --chrome-toolbar: #202124;
        --chrome-omnibox: #303134;
        --chrome-omnibox-focus: #3c4043;
        --chrome-text: #e8eaed;
        --chrome-icon: #bdc1c6;
        --chrome-focus: #8ab4f8;
      }
      html,
      body {
        height: 100%;
      }
      body {
        height: var(--visual-viewport-height, 100dvh);
        display: flex;
        flex-direction: column;
        margin: 0;
        overflow: hidden;
        font-family: Arial, sans-serif;
        color: var(--chrome-text);
        background: var(--chrome-toolbar);
      }
      #toolbar {
        display: flex;
        align-items: center;
        gap: 2px;
        height: 48px;
        padding: 6px 8px;
        background: var(--chrome-toolbar);
        flex: 0 0 auto;
        z-index: 2;
      }
      #toolbar button {
        width: 36px;
        height: 36px;
        border: none;
        border-radius: 50%;
        background: transparent;
        color: var(--chrome-icon);
        font-size: 18px;
        line-height: 1;
        cursor: pointer;
        flex: 0 0 auto;
        transition: background-color 150ms ease, color 150ms ease;
      }
      #toolbar button svg {
        width: 20px;
        height: 20px;
        display: block;
        margin: auto;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      #toolbar button:hover {
        background: rgba(232, 234, 237, 0.08);
      }
      #toolbar button:active {
        background: rgba(232, 234, 237, 0.16);
      }
      #toolbar button:focus-visible {
        outline: 2px solid var(--chrome-focus);
        outline-offset: 0;
      }
      #toolbar button:disabled {
        color: rgba(189, 193, 198, 0.38);
        cursor: default;
        background: transparent;
      }
      #pipBtn[aria-pressed="true"] {
        color: var(--chrome-focus);
        background: rgba(138, 180, 248, 0.16);
      }
      #addr {
        flex: 1 1 auto;
        min-width: 80px;
        height: 34px;
        margin-left: 4px;
        padding: 0 16px;
        border: none;
        border-radius: 17px;
        background: var(--chrome-omnibox);
        color: var(--chrome-text);
        font: inherit;
        font-size: 14px;
        outline: none;
        caret-color: var(--chrome-text);
        transition: background-color 100ms ease, box-shadow 100ms ease;
      }
      #addr:hover {
        background: var(--chrome-omnibox-focus);
      }
      #addr:focus {
        background: var(--chrome-omnibox-focus);
        box-shadow: 0 0 0 2px var(--chrome-focus);
      }
      #addr::placeholder {
        color: #9aa0a6;
      }
      #stage {
        position: relative;
        flex: 1 1 auto;
        min-height: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background: var(--chrome-toolbar);
      }
      canvas {
        max-width: 100%;
        max-height: 100%;
        cursor: pointer;
      }
      #hiddenInput {
        position: fixed;
        bottom: 0;
        left: 0;
        opacity: 0.01;
        width: 1px;
        height: 1px;
        z-index: -1;
      }
      @media (max-width: 600px) {
        #toolbar {
          height: 48px;
          padding: 6px 4px;
        }
        #toolbar button {
          width: 36px;
          height: 36px;
        }
        #addr {
          margin-left: 2px;
          padding-inline: 12px;
        }
      }
    </style>
  </head>
  <body>
    <div id="toolbar">
      <button id="backBtn" title="Back" aria-label="Back" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M15 5l-7 7 7 7" />
        </svg>
      </button>
      <button id="fwdBtn" title="Forward" aria-label="Forward" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M9 5l7 7-7 7" />
        </svg>
      </button>
      <button id="reloadBtn" title="Reload" aria-label="Reload">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20 11a8 8 0 1 0-.6 4" />
          <path d="M20 4v6h-6" />
        </svg>
      </button>
      <input
        id="addr"
        type="text"
        placeholder="Enter URL and press Enter"
        autocomplete="off"
        autocapitalize="none"
        autocorrect="off"
        spellcheck="false"
      />
      <button
        id="pipBtn"
        title="Picture in picture"
        aria-label="Open picture in picture"
        aria-pressed="false"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3" y="5" width="18" height="14" rx="2" />
          <rect x="11" y="11" width="8" height="6" rx="1" />
        </svg>
      </button>
    </div>
    <div id="stage">
      <canvas id="screen"></canvas>
    </div>
    <div id="virtualKeys" role="group" aria-label="Remote keyboard controls">
      <button type="button" data-key="Escape" data-code="Escape" data-key-code="27">Esc</button>
      <button type="button" data-key="Home" data-code="Home" data-key-code="36">Home</button>
      <button type="button" data-key="ArrowUp" data-code="ArrowUp" data-key-code="38" aria-label="Arrow up">&#8593;</button>
      <button type="button" data-key="End" data-code="End" data-key-code="35">End</button>
      <button type="button" data-key="PageUp" data-code="PageUp" data-key-code="33">PgUp</button>
      <button type="button" data-key="Backspace" data-code="Backspace" data-key-code="8" aria-label="Backspace">&#9003;</button>
      <button type="button" data-key="Tab" data-code="Tab" data-key-code="9">Tab</button>
      <button type="button" data-key="ArrowLeft" data-code="ArrowLeft" data-key-code="37" aria-label="Arrow left">&#8592;</button>
      <button type="button" data-key="ArrowDown" data-code="ArrowDown" data-key-code="40" aria-label="Arrow down">&#8595;</button>
      <button type="button" data-key="ArrowRight" data-code="ArrowRight" data-key-code="39" aria-label="Arrow right">&#8594;</button>
      <button type="button" data-key="PageDown" data-code="PageDown" data-key-code="34">PgDn</button>
      <button type="button" data-key="Enter" data-code="Enter" data-key-code="13">Enter</button>
    </div>
    <input
      id="hiddenInput"
      type="text"
      autocomplete="off"
      autocapitalize="none"
      autocorrect="off"
      spellcheck="false"
    />
    <script type="module">
      import { setupPictureInPicture } from "/static/pip.js";
      import { setupScreencastZoom } from "/static/zoom.js";
      import { setupVirtualKeys } from "/static/virtual-keys.js";

      const canvas = document.getElementById("screen");
      const ctx = canvas.getContext("2d");
      setupScreencastZoom(document.getElementById("stage"), canvas);

      let id = 1;
      let pageWidth = 1,
        pageHeight = 1;
      let ws = null;
      let currentWsUrl = null;
      // Pending CDP command responses, keyed by request id.
      const pending = new Map();

      function send(method, params = {}) {
        return new Promise((resolve) => {
          if (ws && ws.readyState === WebSocket.OPEN) {
            const myId = id++;
            pending.set(myId, resolve);
            ws.send(JSON.stringify({ id: myId, method, params }));
          } else {
            resolve(null);
          }
        });
      }

      const addr = document.getElementById("addr");
      const backBtn = document.getElementById("backBtn");
      const fwdBtn = document.getElementById("fwdBtn");
      const reloadBtn = document.getElementById("reloadBtn");
      const hiddenInput = document.getElementById("hiddenInput");
      const virtualKeys = document.getElementById("virtualKeys");
      const pipBtn = document.getElementById("pipBtn");
      const stage = document.getElementById("stage");
      setupVirtualKeys(virtualKeys, send);
      const pictureInPicture = setupPictureInPicture({
        button: pipBtn,
        elements: [stage, hiddenInput],
        videoSource: canvas,
        width: 480,
        height: 320,
        title: "Screencast",
      });

      function focusRemoteInput() {
        hiddenInput.focus({ preventScroll: true });
      }

      // Pull the current navigation history to sync the address bar and the
      // enabled/disabled state of the back/forward buttons.
      async function refreshNav() {
        const msg = await send("Page.getNavigationHistory");
        const r = msg && msg.result;
        if (!r) return;
        const entry = r.entries[r.currentIndex];
        if (entry && document.activeElement !== addr) {
          addr.value = entry.url;
        }
        backBtn.disabled = r.currentIndex <= 0;
        fwdBtn.disabled = r.currentIndex >= r.entries.length - 1;
      }

      async function navHistory(delta) {
        const msg = await send("Page.getNavigationHistory");
        const r = msg && msg.result;
        if (!r) return;
        const target = r.entries[r.currentIndex + delta];
        if (target) await send("Page.navigateToHistoryEntry", { entryId: target.id });
      }

      function go() {
        let url = addr.value.trim();
        if (!url) return;
        // Prefix a scheme when the user types a bare host like "example.com".
        if (!/^[a-z][a-z0-9+.-]*:\/\//i.test(url) && !/^about:/i.test(url)) {
          url = "https://" + url;
        }
        if (ws && ws.readyState === WebSocket.OPEN) {
          send("Page.navigate", { url });
        } else {
          // No live page target to drive (e.g. last tab was closed). Ask the
          // daemon to open a tab; the poll loop will then connect to it.
          fetch("/command", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ command: "open", args: { url } }),
          }).catch(() => {});
        }
        // Return keyboard input to the remote page on every platform.
        focusRemoteInput();
      }

      backBtn.addEventListener("click", () => navHistory(-1));
      fwdBtn.addEventListener("click", () => navHistory(1));
      reloadBtn.addEventListener("click", () => send("Page.reload"));
      addr.addEventListener("keydown", (e) => {
        if (e.key === "Enter") go();
      });

      function startScreencast() {
        send("Page.startScreencast", {
          format: "jpeg",
          quality: 80,
          everyNthFrame: 1,
        });
      }

      function connect(wsUrl) {
        if (ws) {
          ws.onclose = null;
          ws.close();
        }
        currentWsUrl = wsUrl;
        document.title = "Screencast";
        ws = new WebSocket(wsUrl);

        ws.onopen = () => {
          startScreencast();
          send("Page.enable");
          refreshNav();
        };

        ws.onmessage = (e) => {
          const msg = JSON.parse(e.data);
          // Resolve awaited command responses.
          if (msg.id !== undefined && pending.has(msg.id)) {
            pending.get(msg.id)(msg);
            pending.delete(msg.id);
            return;
          }
          // Keep the address bar / buttons in sync on main-frame navigations.
          if (
            msg.method === "Page.frameNavigated" &&
            msg.params.frame &&
            !msg.params.frame.parentId
          ) {
            refreshNav();
          }
          if (msg.method === "Page.screencastFrame") {
            const meta = msg.params.metadata;
            pageWidth = meta.deviceWidth;
            pageHeight = meta.deviceHeight;
            const img = new Image();
            img.onload = () => {
              canvas.width = img.width;
              canvas.height = img.height;
              ctx.drawImage(img, 0, 0);
              pictureInPicture.refreshVideo();
            };
            img.src = "data:image/jpeg;base64," + msg.params.data;
            send("Page.screencastFrameAck", {
              sessionId: msg.params.sessionId,
            });
          }
        };

        ws.onclose = () => {
          currentWsUrl = null;
          pending.clear();
        };
      }

      document.addEventListener("visibilitychange", () => {
        if (!document.hidden) startScreencast();
      });

      // Single poll loop handles initial connection, disconnects, and tab switches
      async function poll() {
        try {
          const res = await fetch("/active-ws");
          const { ws: activeWs } = await res.json();
          if (activeWs && activeWs !== currentWsUrl) {
            connect(activeWs);
          } else if (ws && ws.readyState === WebSocket.OPEN) {
            refreshNav();
          }
        } catch (e) {}
      }
      poll();
      setInterval(poll, 1000);

      function toPageCoords(e) {
        const rect = canvas.getBoundingClientRect();
        const x = ((e.clientX - rect.left) / rect.width) * pageWidth;
        const y = ((e.clientY - rect.top) / rect.height) * pageHeight;
        return { x, y };
      }

      function mouseButton(e) {
        return ["left", "middle", "right"][e.button] || "left";
      }

      // Track which button is currently held so drags carry button state.
      let pressedButton = null;

      function buttonsMask() {
        if (pressedButton === "left") return 1;
        if (pressedButton === "right") return 2;
        if (pressedButton === "middle") return 4;
        return 0;
      }

      function sendMove(e) {
        const { x, y } = toPageCoords(e);
        send("Input.dispatchMouseEvent", {
          type: "mouseMoved",
          x,
          y,
          button: pressedButton || "none",
          buttons: buttonsMask(),
        });
      }

      function onWindowMouseUp(e) {
        const { x, y } = toPageCoords(e);
        send("Input.dispatchMouseEvent", {
          type: "mouseReleased",
          x,
          y,
          button: mouseButton(e),
          buttons: 0,
          clickCount: 1,
        });
        pressedButton = null;
        window.removeEventListener("mousemove", sendMove);
        window.removeEventListener("mouseup", onWindowMouseUp);
      }

      // For touch pointers, transient user activation is granted on release.
      // Focusing from click lets mobile browsers open the software keyboard;
      // pointerdown may focus the input without showing it.
      canvas.addEventListener("click", focusRemoteInput);

      canvas.addEventListener("mousedown", (e) => {
        const { x, y } = toPageCoords(e);
        pressedButton = mouseButton(e);
        send("Input.dispatchMouseEvent", {
          type: "mousePressed",
          x,
          y,
          button: pressedButton,
          buttons: buttonsMask(),
          clickCount: 1,
        });
        // Follow the drag on window so it continues even off the canvas.
        window.addEventListener("mousemove", sendMove);
        window.addEventListener("mouseup", onWindowMouseUp);
      });

      canvas.addEventListener("mousemove", (e) => {
        // Hover moves only when not dragging (drag moves handled on window).
        if (!pressedButton) sendMove(e);
      });

      canvas.addEventListener(
        "wheel",
        (e) => {
          e.preventDefault();
          const { x, y } = toPageCoords(e);
          send("Input.dispatchMouseEvent", {
            type: "mouseWheel",
            x,
            y,
            deltaX: e.deltaX,
            deltaY: e.deltaY,
          });
        },
        { passive: false }
      );

      canvas.addEventListener("contextmenu", (e) => e.preventDefault());

      // The local input is a keyboard/IME proxy for the focused element in the
      // remote page. Keep composition text local until the IME commits it, then
      // insert the complete Unicode string instead of guessing it from keydown.
      hiddenInput.addEventListener("input", (e) => {
        if (e.isComposing) return;
        const text = hiddenInput.value;
        if (text) send("Input.insertText", { text });
        hiddenInput.value = "";
      });

      hiddenInput.addEventListener("keydown", (e) => {
        const usesAltGraph = e.getModifierState("AltGraph");
        const producesText =
          (!e.ctrlKey || usesAltGraph) &&
          !e.metaKey &&
          (e.key.length === 1 || e.key === "Dead" || e.key === "Process" || e.isComposing);
        // Printable keys must perform their local default action so the input
        // event above receives the browser/OS-resolved text. Suppress local
        // defaults for navigation, editing keys, and shortcuts.
        if (!producesText) e.preventDefault();
        send("Input.dispatchKeyEvent", {
          type: "rawKeyDown",
          key: e.key,
          code: e.code,
          windowsVirtualKeyCode: e.keyCode,
          nativeVirtualKeyCode: e.keyCode,
          modifiers:
            (e.altKey ? 1 : 0) |
            (e.ctrlKey ? 2 : 0) |
            (e.metaKey ? 4 : 0) |
            (e.shiftKey ? 8 : 0),
        });
      });

      hiddenInput.addEventListener("keyup", (e) => {
        e.preventDefault();
        send("Input.dispatchKeyEvent", {
          type: "keyUp",
          key: e.key,
          code: e.code,
          windowsVirtualKeyCode: e.keyCode,
          nativeVirtualKeyCode: e.keyCode,
          modifiers:
            (e.altKey ? 1 : 0) |
            (e.ctrlKey ? 2 : 0) |
            (e.metaKey ? 4 : 0) |
            (e.shiftKey ? 8 : 0),
        });
      });
    </script>
  </body>
</html>
