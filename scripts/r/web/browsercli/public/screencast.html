<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content"
    />
    <title>Screencast</title>
    <link rel="icon" href="/static/screencast.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/static/virtual-keys.css" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      :root {
        color-scheme: dark;
        --chrome-toolbar: #202124;
        --chrome-omnibox: #303134;
        --chrome-omnibox-focus: #3c4043;
        --chrome-text: #e8eaed;
        --chrome-icon: #bdc1c6;
        --chrome-focus: #8ab4f8;
      }
      html,
      body {
        height: 100%;
      }
      body {
        height: var(--visual-viewport-height, 100dvh);
        display: flex;
        flex-direction: column;
        margin: 0;
        overflow: hidden;
        font-family: Arial, sans-serif;
        color: var(--chrome-text);
        background: var(--chrome-toolbar);
      }
      #toolbar {
        position: relative;
        display: flex;
        align-items: center;
        gap: 2px;
        height: 48px;
        padding: 6px 8px;
        background: var(--chrome-toolbar);
        flex: 0 0 auto;
        z-index: 2;
      }
      #toolbar button {
        width: 36px;
        height: 36px;
        border: none;
        border-radius: 50%;
        background: transparent;
        color: var(--chrome-icon);
        font-size: 18px;
        line-height: 1;
        cursor: pointer;
        flex: 0 0 auto;
        transition: background-color 150ms ease, color 150ms ease;
      }
      #toolbar button svg {
        width: 20px;
        height: 20px;
        display: block;
        margin: auto;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      #toolbar button:hover {
        background: rgba(232, 234, 237, 0.08);
      }
      #toolbar button:active {
        background: rgba(232, 234, 237, 0.16);
      }
      #toolbar button:focus-visible {
        outline: 2px solid var(--chrome-focus);
        outline-offset: 0;
      }
      #toolbar button:disabled {
        color: rgba(189, 193, 198, 0.38);
        cursor: default;
        background: transparent;
      }
      #pipBtn[aria-pressed="true"] {
        color: var(--chrome-focus);
        background: rgba(138, 180, 248, 0.16);
      }
      #addr {
        flex: 1 1 auto;
        min-width: 80px;
        height: 34px;
        margin-left: 4px;
        padding: 0 16px;
        border: none;
        border-radius: 17px;
        background: var(--chrome-omnibox);
        color: var(--chrome-text);
        font: inherit;
        font-size: 14px;
        outline: none;
        caret-color: var(--chrome-text);
        transition: background-color 100ms ease, box-shadow 100ms ease;
      }
      #addr:hover {
        background: var(--chrome-omnibox-focus);
      }
      #addr:focus {
        background: var(--chrome-omnibox-focus);
        box-shadow: 0 0 0 2px var(--chrome-focus);
      }
      #addr::placeholder {
        color: #9aa0a6;
      }
      #viewportBtn[aria-expanded="true"] {
        color: var(--chrome-focus);
        background: rgba(138, 180, 248, 0.16);
      }
      #viewportMenu {
        position: absolute;
        top: 44px;
        right: 44px;
        width: 210px;
        padding: 6px;
        border: 1px solid #5f6368;
        border-radius: 8px;
        background: #292a2d;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.45);
        z-index: 4;
      }
      #viewportMenu[hidden] {
        display: none;
      }
      #toolbar #viewportMenu button {
        display: flex;
        align-items: center;
        width: 100%;
        height: 34px;
        padding: 0 10px;
        border-radius: 4px;
        color: var(--chrome-text);
        font: inherit;
        font-size: 13px;
        text-align: left;
      }
      #toolbar #viewportMenu button::before {
        width: 18px;
        margin-right: 6px;
        color: var(--chrome-focus);
        content: "";
      }
      #toolbar #viewportMenu button[aria-checked="true"]::before {
        content: "✓";
      }
      #stage {
        position: relative;
        flex: 1 1 auto;
        min-height: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background: var(--chrome-toolbar);
      }
      canvas {
        max-width: 100%;
        max-height: 100%;
        cursor: pointer;
      }
      #hiddenInput {
        position: fixed;
        bottom: 0;
        left: 0;
        opacity: 0.01;
        width: 1px;
        height: 1px;
        z-index: -1;
      }
      @media (max-width: 600px) {
        #toolbar {
          height: 48px;
          padding: 6px 4px;
        }
        #toolbar button {
          width: 36px;
          height: 36px;
        }
        #addr {
          margin-left: 2px;
          padding-inline: 12px;
        }
      }
    </style>
  </head>
  <body>
    <div id="toolbar">
      <button id="backBtn" title="Back" aria-label="Back" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M15 5l-7 7 7 7" />
        </svg>
      </button>
      <button id="fwdBtn" title="Forward" aria-label="Forward" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M9 5l7 7-7 7" />
        </svg>
      </button>
      <button id="reloadBtn" title="Reload" aria-label="Reload">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20 11a8 8 0 1 0-.6 4" />
          <path d="M20 4v6h-6" />
        </svg>
      </button>
      <input
        id="addr"
        type="text"
        placeholder="Enter URL and press Enter"
        autocomplete="off"
        autocapitalize="none"
        autocorrect="off"
        spellcheck="false"
      />
      <button
        id="viewportBtn"
        title="Viewport resolution"
        aria-label="Viewport resolution"
        aria-haspopup="menu"
        aria-expanded="false"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3" y="4" width="18" height="13" rx="2" />
          <path d="M8 21h8M12 17v4" />
        </svg>
      </button>
      <div id="viewportMenu" role="menu" aria-label="Viewport resolution" hidden>
        <button type="button" role="menuitemradio" data-viewport="390x844">Phone 390×844</button>
        <button type="button" role="menuitemradio" data-viewport="768x1024">Tablet 768×1024</button>
        <button type="button" role="menuitemradio" data-viewport="1024x768">Desktop 1024×768</button>
      </div>
      <button
        id="shareBtn"
        title="Share image"
        aria-label="Share current screencast image"
        disabled
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="18" cy="5" r="2.5" />
          <circle cx="6" cy="12" r="2.5" />
          <circle cx="18" cy="19" r="2.5" />
          <path d="M8.2 10.8l7.6-4.5M8.2 13.2l7.6 4.5" />
        </svg>
      </button>
      <button
        id="pipBtn"
        title="Picture in picture"
        aria-label="Open picture in picture"
        aria-pressed="false"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3" y="5" width="18" height="14" rx="2" />
          <rect x="11" y="11" width="8" height="6" rx="1" />
        </svg>
      </button>
    </div>
    <div id="stage">
      <canvas id="screen"></canvas>
    </div>
    <div id="virtualKeys" role="group" aria-label="Remote keyboard controls">
      <button
        type="button"
        id="keyboardBtn"
        title="Toggle keyboard"
        aria-label="Toggle keyboard"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3" y="6" width="18" height="12" rx="2" />
          <path d="M6 10h1M10 10h1M14 10h1M18 10h0M6 13h1M10 13h1M14 13h1M18 13h0M7 16h10" />
        </svg>
      </button>
      <button type="button" data-key="Escape" data-code="Escape" data-key-code="27">Esc</button>
      <button type="button" data-key="Home" data-code="Home" data-key-code="36">Home</button>
      <button type="button" data-key="ArrowUp" data-code="ArrowUp" data-key-code="38" aria-label="Arrow up">&#8593;</button>
      <button type="button" data-key="End" data-code="End" data-key-code="35">End</button>
      <button type="button" data-key="PageUp" data-code="PageUp" data-key-code="33">PgUp</button>
      <button type="button" id="zoomInBtn" aria-label="Zoom in">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="10.5" cy="10.5" r="6.5" />
          <path d="M15.5 15.5L21 21M10.5 7.5v6M7.5 10.5h6" />
        </svg>
      </button>
      <button type="button" data-key="Tab" data-code="Tab" data-key-code="9">Tab</button>
      <button type="button" data-key="ArrowLeft" data-code="ArrowLeft" data-key-code="37" aria-label="Arrow left">&#8592;</button>
      <button type="button" data-key="ArrowDown" data-code="ArrowDown" data-key-code="40" aria-label="Arrow down">&#8595;</button>
      <button type="button" data-key="ArrowRight" data-code="ArrowRight" data-key-code="39" aria-label="Arrow right">&#8594;</button>
      <button type="button" data-key="PageDown" data-code="PageDown" data-key-code="34">PgDn</button>
      <button type="button" id="zoomOutBtn" aria-label="Zoom out">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="10.5" cy="10.5" r="6.5" />
          <path d="M15.5 15.5L21 21M7.5 10.5h6" />
        </svg>
      </button>
    </div>
    <input
      id="hiddenInput"
      type="text"
      autocomplete="off"
      autocapitalize="none"
      autocorrect="off"
      spellcheck="false"
    />
    <script type="module">
      import { setupPictureInPicture } from "/static/pip.js";
      import { setupScreencastZoom } from "/static/zoom.js";
      import { setupVirtualKeys } from "/static/virtual-keys.js";

      const canvas = document.getElementById("screen");
      const ctx = canvas.getContext("2d");
      const zoom = setupScreencastZoom(document.getElementById("stage"), canvas);

      let id = 1;
      let pageWidth = 1,
        pageHeight = 1;
      let ws = null;
      let currentWsUrl = null;
      // Pending CDP command responses, keyed by request id.
      const pending = new Map();

      function send(method, params = {}) {
        return new Promise((resolve) => {
          if (ws && ws.readyState === WebSocket.OPEN) {
            const myId = id++;
            pending.set(myId, resolve);
            ws.send(JSON.stringify({ id: myId, method, params }));
          } else {
            resolve(null);
          }
        });
      }

      const addr = document.getElementById("addr");
      const backBtn = document.getElementById("backBtn");
      const fwdBtn = document.getElementById("fwdBtn");
      const reloadBtn = document.getElementById("reloadBtn");
      const viewportBtn = document.getElementById("viewportBtn");
      const viewportMenu = document.getElementById("viewportMenu");
      const hiddenInput = document.getElementById("hiddenInput");
      const virtualKeys = document.getElementById("virtualKeys");
      const keyboardBtn = document.getElementById("keyboardBtn");
      const shareBtn = document.getElementById("shareBtn");
      const pipBtn = document.getElementById("pipBtn");
      const stage = document.getElementById("stage");
      const zoomOutBtn = document.getElementById("zoomOutBtn");
      const zoomInBtn = document.getElementById("zoomInBtn");
      setupVirtualKeys(virtualKeys, send);
      zoomOutBtn.addEventListener("click", zoom.zoomOut);
      zoomInBtn.addEventListener("click", zoom.zoomIn);

      let currentFrameData = null;

      function currentFrameFile() {
        const binary = atob(currentFrameData);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
        return new File([bytes], `screencast-${Date.now()}.jpg`, {
          type: "image/jpeg",
        });
      }

      function shareCurrentImage() {
        if (!currentFrameData) return;
        const file = currentFrameFile();
        return navigator.share({
          files: [file],
          title: "Screencast",
        });
      }

      const canShareImages =
        navigator.share &&
        typeof File === "function" &&
        (!navigator.canShare ||
          navigator.canShare({
            files: [new File([new Uint8Array(1)], "image.jpg", { type: "image/jpeg" })],
          }));
      if (canShareImages) {
        shareBtn.addEventListener("click", () => {
          shareCurrentImage().catch((error) => {
            if (error.name !== "AbortError") console.error(error);
          });
        });
      } else {
        shareBtn.hidden = true;
      }

      async function setViewport(value) {
        const res = await fetch("/command", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            command: "set-viewport",
            args: { viewport: value },
          }),
        });
        const data = await res.json();
        if (!res.ok || data.error) {
          throw new Error(data.error || "Could not set viewport");
        }
      }

      function closeViewportMenu({ restoreFocus = false } = {}) {
        viewportMenu.hidden = true;
        viewportBtn.setAttribute("aria-expanded", "false");
        if (restoreFocus) viewportBtn.focus();
      }

      viewportBtn.addEventListener("click", () => {
        const willOpen = viewportMenu.hidden;
        viewportMenu.hidden = !willOpen;
        viewportBtn.setAttribute("aria-expanded", String(willOpen));
        if (willOpen) {
          const selected = viewportMenu.querySelector('[aria-checked="true"]');
          (selected || viewportMenu.querySelector("button"))?.focus();
        }
      });

      viewportMenu.addEventListener("click", (event) => {
        const option = event.target.closest("[data-viewport]");
        if (!option) return;
        closeViewportMenu({ restoreFocus: true });
        setViewport(option.dataset.viewport)
          .then(refreshViewport)
          .catch((error) => {
            console.error(error);
            refreshViewport();
          });
      });

      document.addEventListener("click", (event) => {
        if (
          !viewportMenu.hidden &&
          !event.target.closest("#viewportBtn, #viewportMenu")
        ) {
          closeViewportMenu();
        }
      });

      viewportMenu.addEventListener("keydown", (event) => {
        if (event.key === "Escape") {
          closeViewportMenu({ restoreFocus: true });
          return;
        }
        const options = [...viewportMenu.querySelectorAll("[data-viewport]")];
        const currentIndex = options.indexOf(document.activeElement);
        let nextIndex;
        if (event.key === "ArrowDown") nextIndex = (currentIndex + 1) % options.length;
        if (event.key === "ArrowUp") {
          nextIndex = (currentIndex - 1 + options.length) % options.length;
        }
        if (event.key === "Home") nextIndex = 0;
        if (event.key === "End") nextIndex = options.length - 1;
        if (nextIndex !== undefined) {
          event.preventDefault();
          options[nextIndex].focus();
        }
      });

      async function refreshViewport() {
        try {
          const res = await fetch("/viewport");
          const { width, height } = await res.json();
          const value = `${width}x${height}`;
          const selected = viewportMenu.querySelector(
            `[data-viewport="${value}"]`,
          );
          for (const option of viewportMenu.querySelectorAll("[data-viewport]")) {
            option.setAttribute("aria-checked", String(option === selected));
          }
          viewportBtn.title = `Viewport: ${width}×${height}`;
          viewportBtn.setAttribute(
            "aria-label",
            `Viewport: ${width} by ${height}`,
          );
        } catch (error) {}
      }
      refreshViewport();
      const pictureInPicture = setupPictureInPicture({
        button: pipBtn,
        elements: [stage, hiddenInput],
        videoSource: canvas,
        width: 480,
        height: 320,
        title: "Screencast",
      });

      function focusRemoteInput() {
        hiddenInput.focus({ preventScroll: true });
      }

      keyboardBtn.addEventListener("click", () => {
        if (document.activeElement === hiddenInput) {
          hiddenInput.blur();
        } else {
          focusRemoteInput();
        }
      });

      // Pull the current navigation history to sync the address bar and the
      // enabled/disabled state of the back/forward buttons.
      async function refreshNav() {
        const msg = await send("Page.getNavigationHistory");
        const r = msg && msg.result;
        if (!r) return;
        const entry = r.entries[r.currentIndex];
        if (entry && document.activeElement !== addr) {
          addr.value = entry.url;
        }
        backBtn.disabled = r.currentIndex <= 0;
        fwdBtn.disabled = r.currentIndex >= r.entries.length - 1;
      }

      async function navHistory(delta) {
        const msg = await send("Page.getNavigationHistory");
        const r = msg && msg.result;
        if (!r) return;
        const target = r.entries[r.currentIndex + delta];
        if (target) await send("Page.navigateToHistoryEntry", { entryId: target.id });
      }

      function go() {
        let url = addr.value.trim();
        if (!url) return;
        // Prefix a scheme when the user types a bare host like "example.com".
        if (!/^[a-z][a-z0-9+.-]*:\/\//i.test(url) && !/^about:/i.test(url)) {
          url = "https://" + url;
        }
        if (ws && ws.readyState === WebSocket.OPEN) {
          send("Page.navigate", { url });
        } else {
          // No live page target to drive (e.g. last tab was closed). Ask the
          // daemon to open a tab; the poll loop will then connect to it.
          fetch("/command", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ command: "open", args: { url } }),
          }).catch(() => {});
        }
        // Return keyboard input to the remote page on every platform.
        focusRemoteInput();
      }

      backBtn.addEventListener("click", () => navHistory(-1));
      fwdBtn.addEventListener("click", () => navHistory(1));
      reloadBtn.addEventListener("click", () => send("Page.reload"));
      addr.addEventListener("keydown", (e) => {
        if (e.key === "Enter") go();
      });

      function startScreencast() {
        send("Page.startScreencast", {
          format: "jpeg",
          quality: 50,
          everyNthFrame: 1,
        });
      }

      function connect(wsUrl) {
        if (ws) {
          ws.onclose = null;
          ws.close();
        }
        currentWsUrl = wsUrl;
        document.title = "Screencast";
        ws = new WebSocket(wsUrl);

        ws.onopen = () => {
          startScreencast();
          send("Page.enable");
          refreshNav();
        };

        ws.onmessage = (e) => {
          const msg = JSON.parse(e.data);
          // Resolve awaited command responses.
          if (msg.id !== undefined && pending.has(msg.id)) {
            pending.get(msg.id)(msg);
            pending.delete(msg.id);
            return;
          }
          // Keep the address bar / buttons in sync on main-frame navigations.
          if (
            msg.method === "Page.frameNavigated" &&
            msg.params.frame &&
            !msg.params.frame.parentId
          ) {
            refreshNav();
          }
          if (msg.method === "Page.screencastFrame") {
            const meta = msg.params.metadata;
            pageWidth = meta.deviceWidth;
            pageHeight = meta.deviceHeight;
            currentFrameData = msg.params.data;
            const img = new Image();
            img.onload = () => {
              canvas.width = img.width;
              canvas.height = img.height;
              ctx.drawImage(img, 0, 0);
              shareBtn.disabled = false;
              pictureInPicture.refreshVideo();
            };
            img.src = "data:image/jpeg;base64," + msg.params.data;
            send("Page.screencastFrameAck", {
              sessionId: msg.params.sessionId,
            });
          }
        };

        ws.onclose = () => {
          currentWsUrl = null;
          pending.clear();
        };
      }

      document.addEventListener("visibilitychange", () => {
        if (!document.hidden) startScreencast();
      });

      // Single poll loop handles initial connection, disconnects, and tab switches
      async function poll() {
        try {
          refreshViewport();
          const res = await fetch("/active-ws");
          const { ws: activeWs } = await res.json();
          if (activeWs && activeWs !== currentWsUrl) {
            connect(activeWs);
          } else if (ws && ws.readyState === WebSocket.OPEN) {
            refreshNav();
          }
        } catch (e) {}
      }
      poll();
      setInterval(poll, 1000);

      function toPageCoords(e) {
        const rect = canvas.getBoundingClientRect();
        const x = ((e.clientX - rect.left) / rect.width) * pageWidth;
        const y = ((e.clientY - rect.top) / rect.height) * pageHeight;
        return { x, y };
      }

      function mouseButton(e) {
        return ["left", "middle", "right"][e.button] || "left";
      }

      // Track which button is currently held so drags carry button state.
      let pressedButton = null;

      function buttonsMask() {
        if (pressedButton === "left") return 1;
        if (pressedButton === "right") return 2;
        if (pressedButton === "middle") return 4;
        return 0;
      }

      function sendMove(e) {
        const { x, y } = toPageCoords(e);
        send("Input.dispatchMouseEvent", {
          type: "mouseMoved",
          x,
          y,
          button: pressedButton || "none",
          buttons: buttonsMask(),
        });
      }

      function onWindowMouseUp(e) {
        const { x, y } = toPageCoords(e);
        send("Input.dispatchMouseEvent", {
          type: "mouseReleased",
          x,
          y,
          button: mouseButton(e),
          buttons: 0,
          clickCount: 1,
        });
        pressedButton = null;
        window.removeEventListener("mousemove", sendMove);
        window.removeEventListener("mouseup", onWindowMouseUp);
      }

      const hasCoarsePointer = matchMedia("(hover: none) and (pointer: coarse)");
      canvas.addEventListener("click", () => {
        if (!hasCoarsePointer.matches) focusRemoteInput();
      });

      canvas.addEventListener("mousedown", (e) => {
        if (document.activeElement === hiddenInput) e.preventDefault();
        const { x, y } = toPageCoords(e);
        pressedButton = mouseButton(e);
        send("Input.dispatchMouseEvent", {
          type: "mousePressed",
          x,
          y,
          button: pressedButton,
          buttons: buttonsMask(),
          clickCount: 1,
        });
        // Follow the drag on window so it continues even off the canvas.
        window.addEventListener("mousemove", sendMove);
        window.addEventListener("mouseup", onWindowMouseUp);
      });

      canvas.addEventListener("mousemove", (e) => {
        // Hover moves only when not dragging (drag moves handled on window).
        if (!pressedButton) sendMove(e);
      });

      canvas.addEventListener(
        "wheel",
        (e) => {
          e.preventDefault();
          const { x, y } = toPageCoords(e);
          send("Input.dispatchMouseEvent", {
            type: "mouseWheel",
            x,
            y,
            deltaX: e.deltaX,
            deltaY: e.deltaY,
          });
        },
        { passive: false }
      );

      canvas.addEventListener("contextmenu", (e) => e.preventDefault());

      // The local input is a keyboard/IME proxy for the focused element in the
      // remote page. Keep composition text local until the IME commits it, then
      // insert the complete Unicode string instead of guessing it from keydown.
      hiddenInput.addEventListener("input", (e) => {
        if (e.isComposing) return;
        const text = hiddenInput.value;
        if (text) send("Input.insertText", { text });
        hiddenInput.value = "";
      });

      hiddenInput.addEventListener("keydown", (e) => {
        const usesAltGraph = e.getModifierState("AltGraph");
        const producesText =
          (!e.ctrlKey || usesAltGraph) &&
          !e.metaKey &&
          (e.key.length === 1 || e.key === "Dead" || e.key === "Process" || e.isComposing);
        // Printable keys must perform their local default action so the input
        // event above receives the browser/OS-resolved text. Suppress local
        // defaults for navigation, editing keys, and shortcuts.
        if (!producesText) e.preventDefault();
        send("Input.dispatchKeyEvent", {
          type: "rawKeyDown",
          key: e.key,
          code: e.code,
          windowsVirtualKeyCode: e.keyCode,
          nativeVirtualKeyCode: e.keyCode,
          modifiers:
            (e.altKey ? 1 : 0) |
            (e.ctrlKey ? 2 : 0) |
            (e.metaKey ? 4 : 0) |
            (e.shiftKey ? 8 : 0),
        });
      });

      hiddenInput.addEventListener("keyup", (e) => {
        e.preventDefault();
        send("Input.dispatchKeyEvent", {
          type: "keyUp",
          key: e.key,
          code: e.code,
          windowsVirtualKeyCode: e.keyCode,
          nativeVirtualKeyCode: e.keyCode,
          modifiers:
            (e.altKey ? 1 : 0) |
            (e.ctrlKey ? 2 : 0) |
            (e.metaKey ? 4 : 0) |
            (e.shiftKey ? 8 : 0),
        });
      });
    </script>
  </body>
</html>
