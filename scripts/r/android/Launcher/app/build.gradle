plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ross.launcher'
    compileSdk 34

    defaultConfig {
        applicationId "com.ross.launcher"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
        }
    }
}

dependencies {
}
