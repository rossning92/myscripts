plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ross.speechtotext'
    compileSdk 34

    defaultConfig {
        applicationId "com.ross.speechtotext"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"

    }

    lintOptions {
        // workaround: disable lint on release builds because the lint tool crashes with Java 26
        checkReleaseBuilds false
        abortOnError false
    }

    buildTypes {
        release {
            // sign release builds with debug key so it can be installed easily
            signingConfig signingConfigs.debug
        }
    }
}

dependencies {
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.preference:preference:1.2.1'
}
